<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        //operator
        //Assignment operator (=)

        let x = 12;
        console.log(x);

        //Assignment Operator (+)
        let three = 2 + 1;
        console.log(three);
        console.log(typeof(three));
        let four = three + 1 ;
        console.log(four);
        let threeOne = 'three' + 1;
        console.log(threeOne);
        console.log(typeof(threeOne));
        let strNumber = '23' +'32';
        console.log(strNumber);
        console.log(typeof(strNumber));
        let number = 5;
        number += 20; // number =number + 20
        console.log(number);

        //Substration Opreator (-)
        let two = 3 - 1;
        console.log(two);
        let five = '6' - '1';
        console.log(five);
        let num = 25;
        num -= 5; //num =num - 5
        console.log(num);

        //Divistion Operator (/)
        let div1 = 20 /5;
        console.log(div1);
        let div2 = 20 / 7;
        console.log(div2);
        console.log(div2.toFixed(2));
        let div3 = 1 / 0;
        console.log(div3);
        let div = 20;
        div /=4; //div=div/4
        console.log(div);

        //Remainder Operator (%)
        let rem1 = 20 % 5;
        console.log(rem1);
        let rem2 = 20 % 7;
        console.log(rem2);
        let rem3 = 1% 0;
        console.log(rem3); // Nan - not a number
        let rem = 25;
        rem %=2;
        console.log(rem)

        //Multiplication operator (*)
        let mul1 = 12 * 12;
        console.log(mul1);
        let mul2 = -12 * 12 ;
        console.log(mul2);
        let mul = 5;
        mul *= 25 ;// mul = mul * 5
        console.log(mul);

        //Exponentiation Operatoe
        let exp1 = 2 ** 2;
        console.log(exp1);
        let exp2 = 4 ** 6; // 4 * 4 * 4 * 4 * 4 * 4
        console.log(exp2);

        //percendence
        // * / %
        //+ -
        // =

        let total = 1 * 2 + 5 /2 % 2;
        console.log(total);
    



    </script>
