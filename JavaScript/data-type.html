<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script>
        //Data type

        //String data type

        let name = "Khin Mee Mee Aung";
        console.log(name);
        console.log(typeof (name));
        let job = "Web Development and Instructor";
        console.log(job);
        console.log(typeof (job));
        let company = `KhinMee`;
        console.log(company);
        console.log(typeof (company));

        //Number of type
        let age = 24;
        console.log(age);
        console.log(typeof (age));
        let pi = 3.14;
        console.log(pi);
        console.log(typeof (pi));

        //Boolean data type
        let js = true;
        console.log(js);
        console.log(typeof (js));
        let java = false;
        console.log(java);
        console.log(typeof (java));

        //Array

        let arr = ['apple', 'orange', '2300', true];
        console.log(arr);
        console.log(arr[1]);
        console.log(arr[3]);

        let arr2 = ['Apple', 'Banana', 'Mango'];
        console.log(arr2);
        console.log(arr2[1]);
        console.log(typeof arr2);

        let arr3 = [["Maung Maung", "Aung Aung"], [22, 23, 24], ["Mandalay"
            , "Magway", "Yangon"]]
    console.log(arr3);
    console.log(arr3[0][0]);
    console.log(arr3[1][0]);
    console.log(arr3[2][0]);

    </script>
</head>
